# Shadow-mode pilot on your own infrastructure: Postgres 16 + the Manipulation Shield API and console.
# Put a TLS-terminating reverse proxy in front before anyone outside this host uses it.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      SHIELD_DB_PASSWORD: ${SHIELD_DB_PASSWORD:?set SHIELD_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres-init.sh:/docker-entrypoint-initdb.d/10-shield.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shield"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    environment:
      DATABASE_URL: postgres://shield_owner:${SHIELD_DB_PASSWORD}@db:5432/shield
      # The Claude classifier stays off unless you set SHIELD_LLM=on and a key (it costs money,
      # and message text is sent to Anthropic: see docs/data-handling.md).
      SHIELD_LLM: ${SHIELD_LLM:-off}
      KEEL_ANTHROPIC_API_KEY: ${KEEL_ANTHROPIC_API_KEY:-}
    ports:
      - "127.0.0.1:4180:4180"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
