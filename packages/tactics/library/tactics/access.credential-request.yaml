id: access.credential-request
name: Credential request
family: access
stages: [enterprise]
version: 1.0.0
status: active
severity: high
description: >-
  A direct request for a password or login, or a push to re-enter credentials at a supplied
  link to "keep access" or "verify the account".
explanation: 'This request asks for login credentials ("{evidence}").'
indicators:
  lexical:
    - verify your account
    - confirm your credentials
    - re-enter your password
    - validate your mailbox
    - your account will be locked
  patterns:
    - "(send|share|give|confirm|provide) (me |us )?(your|the) (password|credentials|login|username and password)"
examples:
  positive:
    - "Please confirm your credentials at the link below to avoid losing access."
    - "Send me your login so I can pull the report while you're out."
  hard_negative:
    - "IT will never ask for your password. Report any message that does."
    - "Your password expires in 7 days; change it at id.acme.com as usual."
references:
  - "CISA: Avoiding Social Engineering and Phishing Attacks"
author: seed-library
